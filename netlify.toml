# ==========================================
# AYEZA COSMETICS — Netlify Configuration
# ==========================================
# Next.js 16 (App Router) + Turborepo monorepo
# Frontend: apps/web  |  Backend: Railway (separate service)

[build]
  # Run from the repo root so npm workspaces / turbo resolve correctly
  base    = "."
  command = "npm install && npx turbo run build --filter=@ayeza/web"
  # @netlify/plugin-nextjs reads .next from here
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION             = "20"
  NPM_VERSION              = "10"
  TURBO_TELEMETRY_DISABLED = "1"
  # Safety-net: baked into the bundle at build time.
  # Also set this in Netlify Dashboard → Site Settings → Environment Variables.
  NEXT_PUBLIC_API_URL      = "https://ayezacosmetics-production.up.railway.app/api"
  NEXT_PUBLIC_APP_NAME     = "AYEZA COSMETICS"

# ------------------------------------
# Next.js SSR / ISR / API routes
# @netlify/plugin-nextjs handles ALL routing automatically.
# Do NOT add manual [[redirects]] — they override the plugin and break routing.
# ------------------------------------
[[plugins]]
  package = "@netlify/plugin-nextjs"
